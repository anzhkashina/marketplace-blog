[tool.poetry]
name = "marketplace-blog"
version = "0.1.0"
description = "Api for the marketplace's blog"
authors = ["Kashina Anzhelika <anzhelikakashina2014yandex.ru@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src/marketplace_blog" },
]

[tool.poetry.dependencies]
python = "==3.11.*"
fastapi = "^0.115.11"
uvicorn = "^0.34.0"
ruff = "^0.9.9"
sqlalchemy = "^2.0.38"
psycopg2-binary = "^2.9.10"
celery = {extras = ["redis"], version = "^5.4.0"}
aiohttp = "^3.11.13"
python-multipart = "^0.0.20"
python-jose = "^3.4.0"
jwt = "^1.3.1"
dotenv = "^0.9.9"
pytz = "^2025.1"
bcrypt = "^4.3.0"
boto3 = "^1.37.9"
pydantic = "^2.10.6"
alembic = "^1.15.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
